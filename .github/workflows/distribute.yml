name: Distribute

on:
  workflow_call:
    inputs:
      ios:
        type: boolean
        default: false
      android:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ios:
        description: Upload to TestFlight
        type: boolean
        default: true
      android:
        description: Upload to the Play internal track
        type: boolean
        default: true

permissions:
  contents: read

env:
  BUNDLE_DEPLOYMENT: "true"
  BUNDLE_PATH: vendor/bundle

jobs:
  testflight:
    name: TestFlight
    if: inputs.ios
    runs-on: xcode-27
    timeout-minutes: 60
    environment: stores
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build numbers are the commit count, which needs the full history.
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: ruby

      - name: Select Xcode
        run: bash apps/ios/select-xcode.sh

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'Gemfile.lock') }}

      - run: bundle install

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: bundle exec fastlane ios beta

  play-internal:
    name: Play internal testing
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: stores
    concurrency:
      group: play-internal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version codes are the commit count, which needs the full history.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: ruby

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'Gemfile.lock') }}

      - run: bundle install

      - name: Restore the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build and upload to the internal track
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android beta
