name: iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: App, intents, and scenario journeys
    # Siri entity schemas and onscreen annotations require the Xcode 27 SDKs.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun

      - name: Select Xcode
        run: bash apps/ios/select-xcode.sh

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build for iOS Simulator
        run: bash apps/ios/verify.sh app

      - name: Run intents and hermetic UI journeys
        run: bash apps/ios/verify.sh ui

      - name: Upload app test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-evidence
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14

  test-kit:
    name: UNESKit and shared contracts
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun

      - name: Select Xcode
        run: bash apps/ios/select-xcode.sh

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # iOS Simulator, not macOS: UNESKit has iOS-only SwiftUI (navigationBar*) that won't build for macOS.
      # Pin pt-BR: alert-copy assertions expect the app's primary language, not the sim default (en).
      - name: Run UNESKit tests
        run: bash apps/ios/verify.sh kit

      - name: Upload package test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kit-evidence
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14
