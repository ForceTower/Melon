name: iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: App, intents, and scenario journeys
    # Siri entity schemas and onscreen annotations require the Xcode 27 SDKs.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: bun

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Return to latest after Xcode 27.2 leaves beta.
          xcode-version: "27.1"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build for iOS Simulator
        run: bash apps/ios/verify.sh app

      - name: Run intents and hermetic UI journeys
        run: bash apps/ios/verify.sh ui

      - name: Upload app test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-evidence
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14

  test-kit:
    name: UNESKit and shared contracts
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: bun

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Return to latest after Xcode 27.2 leaves beta.
          xcode-version: "27.1"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # iOS Simulator, not macOS: UNESKit has iOS-only SwiftUI (navigationBar*) that won't build for macOS.
      # Pin pt-BR: alert-copy assertions expect the app's primary language, not the sim default (en).
      - name: Run UNESKit tests
        run: bash apps/ios/verify.sh kit

      - name: Upload package test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-kit-evidence
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14
