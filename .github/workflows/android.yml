name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble + test + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Android and JVM verification
        run: bun run android:check

      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-and-lint-reports
          retention-days: 14
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*
            build/reports/ktlint/**
            build/reports/profile/**
          if-no-files-found: warn

  smoke:
    name: Synthetic account emulator journey
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build scenario APKs before starting the emulator
        run: >-
          ./gradlew :apps:android:app:assembleScenario
          :apps:android:app:assembleScenarioAndroidTest
          -Pmelon.testBuildType=scenario --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed app with hermetic fixtures
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb -s emulator-5554 shell settings put global hide_error_dialogs 1
            adb -s emulator-5554 shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            bun run android:scenario home.populated --serial emulator-5554 --no-build
            bun run android:scenario home.populated --serial emulator-5554 --no-build --render
            bun run android:scenario auth.invalid-credentials --serial emulator-5554 --no-build
            bun run android:scenario sync.unavailable --serial emulator-5554 --no-build
            bun run android:scenario home.offline-with-cache --serial emulator-5554 --no-build
            bun run android:scenario auth.session-expired --serial emulator-5554 --no-build
            bun run android:scenario messages.empty --serial emulator-5554 --no-build
            bun run android:scenario notification.message-missing --serial emulator-5554 --no-build
            bun run android:scenario notification.message-after-refresh --serial emulator-5554 --no-build
            bun run android:scenario enrollment.schedule-conflict --serial emulator-5554 --no-build
            bun run android:scenario enrollment.under-minimum --serial emulator-5554 --no-build
            bun run android:scenario enrollment.over-maximum --serial emulator-5554 --no-build
            bun run android:scenario enrollment.deadline-expired --serial emulator-5554 --no-build
            bun run android:scenario enrollment.submit-retry --serial emulator-5554 --no-build
            bun run android:scenario disciplines.current --serial emulator-5554 --no-build
            bun run android:scenario disciplines.history --serial emulator-5554 --no-build
            bun run android:scenario disciplines.download-retry --serial emulator-5554 --no-build
            bun run android:scenario discipline.detail.finals --serial emulator-5554 --no-build
            bun run android:scenario discipline.detail.attendance --serial emulator-5554 --no-build
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-scenario-evidence
          retention-days: 14
          path: |
            artifacts/android/**
            apps/android/app/build/reports/androidTests/**
            apps/android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
