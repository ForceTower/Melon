name: Android performance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Collect Baseline Profiles instead of timing benchmarks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-performance-device
  cancel-in-progress: false

jobs:
  performance:
    name: Dedicated physical device
    runs-on: [self-hosted, linux, android-performance]
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: ${{ vars.ANDROID_PERFORMANCE_SERIAL }}
      COLLECT_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run controlled measurement or collect profile
        run: |
          test -n "$ANDROID_SERIAL"
          if [ "$COLLECT_PROFILE" = "true" ]; then
            bun run android:performance --serial "$ANDROID_SERIAL" --profile
          else
            bun run android:performance --serial "$ANDROID_SERIAL"
          fi
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-performance-${{ github.run_id }}
          retention-days: 30
          path: |
            artifacts/android-performance/**
            apps/android/benchmark/build/reports/**
            apps/android/benchmark/build/outputs/connected_android_test_additional_output/**
            apps/android/benchmark/build/outputs/androidTest-results/**
          if-no-files-found: warn
