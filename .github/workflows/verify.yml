name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # A newer push to main must not abort a store upload that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      landing: ${{ steps.select.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - id: select
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/ci-affected.ts

  repository:
    name: Conventions, fixtures and tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run verify:repository
      - name: Upload repository test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-test-results
          retention-days: 14
          path: artifacts/repository-tests.xml
          if-no-files-found: warn

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    uses: ./.github/workflows/landing.yml

  required:
    name: Required verification
    if: always()
    needs: [changes, repository, android, ios, landing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Check every selected lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          ANDROID_SELECTED: ${{ needs.changes.outputs.android }}
          IOS_SELECTED: ${{ needs.changes.outputs.ios }}
          LANDING_SELECTED: ${{ needs.changes.outputs.landing }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: bun run scripts/ci-required.ts

  distribute:
    name: Internal distribution
    needs: [changes, required]
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.ios == 'true' || needs.changes.outputs.android == 'true')
    uses: ./.github/workflows/distribute.yml
    with:
      ios: ${{ needs.changes.outputs.ios == 'true' }}
      android: ${{ needs.changes.outputs.android == 'true' }}
